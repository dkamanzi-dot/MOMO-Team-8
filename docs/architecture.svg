<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">MoMo SMS transaction system architecture</title>
  <desc id="description">Architecture flow from MoMo XML data through ETL processing into an SQL database, the API and JSON export, and the web dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#e7f0f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31708f"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#background)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">MoMo SMS Transaction System</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#496579">ETL processing, SQL storage, API delivery, and dashboard analytics</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="45" y="180" width="170" height="130" rx="12" fill="#ffffff" stroke="#31708f" stroke-width="2"/>
    <text x="130" y="225" font-size="19" font-weight="700" fill="#17324d">MoMo XML</text>
    <text x="130" y="253" font-size="15" fill="#496579">SMS source data</text>
    <text x="130" y="280" font-size="14" fill="#496579">Raw transactions</text>

    <rect x="270" y="180" width="170" height="130" rx="12" fill="#ffffff" stroke="#31708f" stroke-width="2"/>
    <text x="355" y="220" font-size="19" font-weight="700" fill="#17324d">ETL Pipeline</text>
    <text x="355" y="249" font-size="14" fill="#496579">Parse XML</text>
    <text x="355" y="273" font-size="14" fill="#496579">Clean and normalize</text>
    <text x="355" y="297" font-size="14" fill="#496579">Categorize records</text>

    <rect x="495" y="180" width="190" height="130" rx="12" fill="#ffffff" stroke="#3f8f6b" stroke-width="2"/>
    <text x="590" y="220" font-size="19" font-weight="700" fill="#17324d">SQL Database</text>
    <text x="590" y="249" font-size="14" fill="#496579">Users and transactions</text>
    <text x="590" y="273" font-size="14" fill="#496579">Categories and logs</text>
    <text x="590" y="297" font-size="14" fill="#496579">Constraints and indexes</text>

    <rect x="740" y="115" width="180" height="130" rx="12" fill="#ffffff" stroke="#d08b32" stroke-width="2"/>
    <text x="830" y="157" font-size="19" font-weight="700" fill="#17324d">FastAPI</text>
    <text x="830" y="186" font-size="14" fill="#496579">CRUD endpoints</text>
    <text x="830" y="210" font-size="14" fill="#496579">Validation</text>
    <text x="830" y="234" font-size="14" fill="#496579">Analytics</text>

    <rect x="740" y="275" width="180" height="130" rx="12" fill="#ffffff" stroke="#d08b32" stroke-width="2"/>
    <text x="830" y="317" font-size="19" font-weight="700" fill="#17324d">JSON Export</text>
    <text x="830" y="346" font-size="14" fill="#496579">Nested transactions</text>
    <text x="830" y="370" font-size="14" fill="#496579">Users and categories</text>
    <text x="830" y="394" font-size="14" fill="#496579">Schema validation</text>

    <rect x="975" y="180" width="180" height="130" rx="12" fill="#ffffff" stroke="#b34d58" stroke-width="2"/>
    <text x="1065" y="225" font-size="19" font-weight="700" fill="#17324d">Web Dashboard</text>
    <text x="1065" y="254" font-size="14" fill="#496579">Charts</text>
    <text x="1065" y="278" font-size="14" fill="#496579">Transaction tables</text>
  </g>

  <g fill="none" stroke="#31708f" stroke-width="3" marker-end="url(#arrow)">
    <path d="M215 245 H270"/>
    <path d="M440 245 H495"/>
    <path d="M685 220 H740"/>
    <path d="M685 270 C715 270 715 340 740 340"/>
    <path d="M920 180 H975"/>
    <path d="M920 340 C950 340 950 270 975 270"/>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#496579">Source -&gt; Parse -&gt; Clean -&gt; Categorize -&gt; Store -&gt; Serve</text>
</svg>